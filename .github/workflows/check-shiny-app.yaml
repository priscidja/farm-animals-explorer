name: Check Shiny App

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  source-app:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install app dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::plotly
            any::tidyverse
            any::bslib
            any::jsonlite

      - name: Source app and helper files
        run: |
          Rscript -e 'source("R/data_access.R")'
          Rscript -e 'source("scripts/Interactive_charts_for_App.R")'
          Rscript -e 'source("scripts/Quiz.R")'
          Rscript -e 'source("app.R", local = new.env())'
